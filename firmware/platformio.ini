; 自动数羊固件 —— 单工程多环境
;   gate     : 门口主机 ESP32-S3-DevKitC-1 N16R8（8 路光电、TM1637、ESP-NOW 从机、WiFi 上云）
;   handheld : 手持器 ESP32-C3 SuperMini（OLED、六键、ESP-NOW 主机）
;   native   : 在 PC 上跑 SheepSession 纯逻辑单元测试（无需硬件）
;
; 构建门口固件:   pio run -e gate
; 构建手持固件:   pio run -e handheld
; 跑逻辑单元测试: pio test -e native

[platformio]
default_envs = gate, handheld

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[esp_common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200

[env:gate]
extends = esp_common
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<gate/>

[env:handheld]
extends = esp_common
board = esp32-c3-devkitm-1
build_src_filter = +<handheld/>
lib_deps =
    olikraus/U8g2@^2.35.30

[env:native]
platform = native
build_src_filter = -<gate/> -<handheld/>
